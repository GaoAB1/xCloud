# ============================================================
# xCloud · OnlyOffice 反向代理性能优化配置（Nginx）
# 适用场景：通过 Nginx 反代 OnlyOffice（http://127.0.0.1:8080）
#
# 本配置解决的核心问题：
#   1. OnlyOffice 前端静态资源（web-apps）未压缩时体积巨大（几十 MB），
#      gzip 压缩后可减少 70-80% 传输量 → 加载速度显著提升
#   2. 静态资源带版本 hash，可安全设置长缓存 → 二次打开秒开
#   3. HTTP/2 多路复用 → 并行加载大量 JS/CSS
#   4. WebSocket 支持（OnlyOffice 协同编辑用）
#
# 使用方法：把本文件放入 /etc/nginx/conf.d/ 或 include 到你的站点配置
# ============================================================

# ── 全局 gzip 压缩（放在 http 块，或直接用下面 server 内 gzip 指令） ──
# 若你的 nginx.conf 已在 http 块开启 gzip，可跳过此段
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_buffers 16 8k;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/xml
  application/rss+xml
  image/svg+xml
  font/woff2
  application/vnd.ms-fontobject
  application/x-font-ttf;

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name office.soulan.top;   # ← 改成你的 OnlyOffice 域名

  # ── SSL 证书（按你的实际情况填写） ──
  ssl_certificate     /etc/nginx/ssl/office.soulan.top.pem;
  ssl_certificate_key /etc/nginx/ssl/office.soulan.top.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;

  # ── 上游 OnlyOffice（docker-compose 映射端口 8080） ──
  upstream onlyoffice {
    server 127.0.0.1:8080;
    keepalive 32;                    # 保持连接复用，减少握手开销
  }

  # ── 健康检查 ──
  location = /healthcheck {
    proxy_pass http://onlyoffice/healthcheck;
    proxy_set_header Host $host;
    access_log off;
  }

  # ── 静态资源：带版本 hash 的 web-apps 文件，可安全长缓存 ──
  # OnlyOffice 资源路径形如 /9.4.0-<hash>/web-apps/...，hash 变化即版本升级
  location ~* ^/[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]+/web-apps/ {
    proxy_pass http://onlyoffice;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;

    # 长缓存：版本化资源内容不可变
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Cache-Status $upstream_cache_status;
  }

  # ── 常规静态资源（api.js 等）──
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico)$ {
    proxy_pass http://onlyoffice;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;

    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # ── WebSocket（协同编辑实时通信） ──
  location /docservice/ {
    proxy_pass http://onlyoffice/docservice/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;       # WebSocket 升级
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ── 其余所有请求（转换 API、回调等） ──
  location / {
    proxy_pass http://onlyoffice;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # 上传/回调是大文件，关闭缓冲反而更快（交给 OS 缓冲）
    proxy_request_buffering off;
    proxy_buffering off;
  }
}

# ── HTTP → HTTPS 跳转 ──
server {
  listen 80;
  listen [::]:80;
  server_name office.soulan.top;
  return 301 https://$host$request_uri;
}
