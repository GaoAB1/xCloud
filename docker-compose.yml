services:
  xcloud:
    build: .
    image: xcloud:latest
    container_name: xcloud
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      # 浏览器访问 OnlyOffice 的地址（改为你的服务器 IP / 域名）
      - ONLYOFFICE_URL=http://localhost:8080
      # 面板(容器内)访问 OnlyOffice 的地址（服务名:容器端口 80）
      - ONLYOFFICE_INTERNAL_URL=http://onlyoffice
      # OnlyOffice(容器内)访问面板的地址，用于下载文档与保存回调
      - PANEL_URL=http://xcloud:3000
      # 面板 JWT 密钥（保护 raw 下载与保存回调接口），务必改为随机长字符串
      - JWT_SECRET=please-change-me-to-a-long-random-string
    depends_on:
      - onlyoffice

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # 关闭 OnlyOffice 自带 JWT；面板用自己的 JWT 保护文档下载与保存回调
      - JWT_ENABLED=false
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts

volumes:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_fonts:
