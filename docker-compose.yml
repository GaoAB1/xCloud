services:
  xcloud:
    build: .
    image: xcloud:latest
    container_name: xcloud
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      # 浏览器访问 OnlyOffice 的地址（内网填 NAS IP，公网填域名，如 http://office.soulan.top）
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-http://localhost:8080}
      # 面板(容器内)访问 OnlyOffice 的地址（服务名:容器端口 80，保持内网）
      - ONLYOFFICE_INTERNAL_URL=http://onlyoffice
      # OnlyOffice(容器内)访问面板的地址，用于下载文档与保存回调（保持内网）
      - PANEL_URL=${PANEL_URL:-http://xcloud:3000}
      # JWT 密钥：面板与 OnlyOffice 必须使用同一个值（建议在 .env 中统一设置）
      - JWT_SECRET=${JWT_SECRET:-please-change-me-to-a-long-random-string}
    depends_on:
      - onlyoffice

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # 开启 OnlyOffice JWT，并与面板共享同一密钥（JWT_SECRET 必须与 xcloud 完全一致）
      - JWT_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-please-change-me-to-a-long-random-string}
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts

volumes:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_fonts:
